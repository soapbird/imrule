# cargo-deny policy, checked by `make deny` and CI.

[graph]
all-features = true

[advisories]
ignore = []

[licenses]
# Dual-licensed crates (memchr: Unlicense OR MIT, r-efi: MIT OR Apache-2.0 OR
# LGPL-2.1-or-later) are accepted through MIT, so neither extra license is listed.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSL-1.0",
    "MIT",
    "Unicode-3.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
