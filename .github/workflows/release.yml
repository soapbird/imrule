name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

  HOMEBREW_TAP_REPO: homebrew-tap
jobs:
  verify-version:
    name: Verify tag matches VERSION
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Compare tag with VERSION
        run: |
          expected="v$(cat VERSION)"
          if [ "${GITHUB_REF_NAME}" != "${expected}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match VERSION (${expected})"
            exit 1
          fi

  build:
    name: Build release binaries
    runs-on: ${{ matrix.os }}
    needs: verify-version
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-15
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-15
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: "1.85"
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          mkdir -p dist/imrule-${{ matrix.target }}
          cp target/${{ matrix.target }}/release/imrule dist/imrule-${{ matrix.target }}/
          cp README.md LICENSE dist/imrule-${{ matrix.target }}/ 2>/dev/null || true
          cd dist
          tar czf imrule-${{ matrix.target }}.tar.gz imrule-${{ matrix.target }}
          sha256sum imrule-${{ matrix.target }}.tar.gz > imrule-${{ matrix.target }}.tar.gz.sha256

      - name: Package binary (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/imrule-${{ matrix.target }} | Out-Null
          Copy-Item target/${{ matrix.target }}/release/imrule.exe dist/imrule-${{ matrix.target }}/
          Copy-Item README.md dist/imrule-${{ matrix.target }}/ -ErrorAction SilentlyContinue
          Copy-Item LICENSE dist/imrule-${{ matrix.target }}/ -ErrorAction SilentlyContinue
          Compress-Archive -Path dist/imrule-${{ matrix.target }}/* -DestinationPath dist/imrule-${{ matrix.target }}.zip
          $hash = Get-FileHash dist/imrule-${{ matrix.target }}.zip -Algorithm SHA256
          $hash.Hash | Out-File -FilePath dist/imrule-${{ matrix.target }}.zip.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: imrule-${{ matrix.target }}
          path: dist/imrule-${{ matrix.target }}.*
          if-no-files-found: error

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: "1.85"

      - name: Install git-cliff
        run: cargo install git-cliff --version 2.12.0 --locked

      - name: Generate changelog
        id: changelog
        run: |
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "body<<$EOF" >> "$GITHUB_OUTPUT"
          git cliff --strip header --current >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          files: dist/*

      - name: Checkout Homebrew tap
        if: env.HOMEBREW_TAP_TOKEN != ''
        # Credentials stay persisted here: "Publish Homebrew tap" runs `git push`.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ github.repository_owner }}/${{ env.HOMEBREW_TAP_REPO }}
          path: homebrew-tap
          token: ${{ env.HOMEBREW_TAP_TOKEN }}
      - name: Generate Homebrew formula
        if: env.HOMEBREW_TAP_TOKEN != ''
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          REPO="${GITHUB_REPOSITORY}"
          RELEASE_BASE="https://github.com/${REPO}/releases/download/v${VERSION}"

          mac_arm_sha="$(cut -d ' ' -f1 dist/imrule-aarch64-apple-darwin.tar.gz.sha256)"
          mac_intel_sha="$(cut -d ' ' -f1 dist/imrule-x86_64-apple-darwin.tar.gz.sha256)"
          linux_intel_sha="$(cut -d ' ' -f1 dist/imrule-x86_64-unknown-linux-gnu.tar.gz.sha256)"

          mkdir -p homebrew-tap/Formula
          cat > homebrew-tap/Formula/imrule.rb <<EOF
          class Imrule < Formula
            desc "Apply the same rules to all coding agents"
            homepage "https://github.com/${REPO}"
            version "${VERSION}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "${RELEASE_BASE}/imrule-aarch64-apple-darwin.tar.gz"
                sha256 "${mac_arm_sha}"
              else
                url "${RELEASE_BASE}/imrule-x86_64-apple-darwin.tar.gz"
                sha256 "${mac_intel_sha}"
              end
            end

            on_linux do
              if Hardware::CPU.intel?
                url "${RELEASE_BASE}/imrule-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${linux_intel_sha}"
              end
            end

            def install
              bin.install "imrule"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/imrule --version")
            end
          end
          EOF

      - name: Publish Homebrew tap
        if: env.HOMEBREW_TAP_TOKEN != ''
        working-directory: homebrew-tap
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/imrule.rb
          if git diff --cached --quiet; then
            echo "Homebrew formula is already up to date."
          else
            git commit -m "Update imrule formula to ${VERSION}"
            git push
          fi
